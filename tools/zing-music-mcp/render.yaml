services:
  - type: web
    name: xiaozhi-music-mcp
    runtime: docker
    plan: free
    # Khi push RIENG thu muc nay lam repo: Dockerfile + render.yaml nam cung
    # nhau o goc repo do (Dockerfile COPY requirements.txt/server.py cung thu muc).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE
        sync: false
      # Go MCP truc tiep streamable-http — MCP (/mcp) + stream (/stream/*.mp3)
      # chung mot process, mot cong. Khong can mcp_pipe tren Render.
      - key: MCP_TRANSPORT
        value: streamable-http
      # Chat luong am thanh (bo trong = dung mac dinh trong server.py):
      #   AUDIO_SAMPLE_RATE=24000  -> phai khop AUDIO_OUTPUT_SAMPLE_RATE cua board
      #   AUDIO_CHANNELS=1         -> loa robot mono
      #   AUDIO_BITRATE=160k       -> tran cua libmp3lame o 24 kHz; 128k cung ok
      #   AUDIO_PRESET=speaker     -> bo loc bu tru loa nho (xem server.py)
      #                              flat|warm|bright|loud|none
      #   AUDIO_FILTERS            -> chuoi ffmpeg -af tuy y, DE preset khi duoc set
      - key: AUDIO_SAMPLE_RATE
        value: "24000"
      - key: AUDIO_CHANNELS
        value: "1"
      - key: AUDIO_BITRATE
        value: "160k"
      - key: AUDIO_PRESET
        value: "speaker"
