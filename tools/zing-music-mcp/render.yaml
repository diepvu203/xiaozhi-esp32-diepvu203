services:
  - type: web
    name: xiaozhi-music-mcp
    runtime: docker
    plan: free
    # Khi push RIENG thu muc nay lam repo: Dockerfile + render.yaml nam cung
    # nhau o goc repo do (Dockerfile COPY requirements.txt/server.py cung thu muc).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE
        sync: false
      # Pipe mode 24/7: mcp_pipe ket noi OUT den MCP_ENDPOINT (wss api.xiaozhi.me)
      # de dang ky 2 tool nhac len xiaozhi.me; server.py chay stdio, thread nen
      # phuc vu /health + /stream/*.mp3 tren PORT Render (healthCheckPath=/health).
      - key: MCP_TRANSPORT
        value: stdio
      - key: MCP_ENDPOINT
        sync: false
      # YouTube anti-bot: base64 cua cookies.txt (trinh duy dang nhap YouTube).
      # IP datacenter bi chan "Sign in to confirm you're not a bot".
      - key: YTDLP_COOKIES_B64
        sync: false
      # Proxy tuy chon neu co (vd http://user:pass@host:port).
      - key: YTDLP_PROXY
        sync: false
      # Chat luong am thanh (bo trong = dung mac dinh trong server.py):
      #   AUDIO_SAMPLE_RATE=24000  -> phai khop AUDIO_OUTPUT_SAMPLE_RATE cua board
      #   AUDIO_CHANNELS=1         -> loa robot mono
      #   AUDIO_BITRATE=160k       -> tran cua libmp3lame o 24 kHz; 128k cung ok
      #   AUDIO_PRESET=speaker     -> bo loc bu tru loa nho (xem server.py)
      #                              flat|warm|bright|loud|none
      #   AUDIO_FILTERS            -> chuoi ffmpeg -af tuy y, DE preset khi duoc set
      - key: AUDIO_SAMPLE_RATE
        value: "24000"
      - key: AUDIO_CHANNELS
        value: "1"
      - key: AUDIO_BITRATE
        value: "160k"
      - key: AUDIO_PRESET
        value: "speaker"
